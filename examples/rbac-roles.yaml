# Royak's own RbacRole — a role named X applies to the authenticated user X.
#
# Identity comes only from a verified bearer token (ROYAK_TOKEN, or the token
# table in ROYAK_TOKEN_FILE: "token,user,uid,\"group1,group2\"" per line).
# Authorization is deny-by-default: a user with no matching role or binding
# can do nothing. Members of group system:masters are cluster-admin. Native
# Role/ClusterRole/RoleBinding/ClusterRoleBinding work the same way.
#
# Deploy: royak apply examples/rbac-roles.yaml
# Test (as user "viewer", token from your token file):
#   curl -X POST http://localhost:6443/apis/apps/v1/namespaces/default/deployments \
#        -H "Authorization: Bearer $VIEWER_TOKEN" -H 'Content-Type: application/yaml' \
#        --data-binary @deploy.yaml   # → 403 Forbidden

apiVersion: v1
kind: RbacRole
metadata:
  name: admin
spec:
  rules:
  - resources: ["*"]
    verbs: ["*"]
    namespaces: ["*"]
---
apiVersion: v1
kind: RbacRole
metadata:
  name: viewer
spec:
  rules:
  - resources: ["pods", "deployments", "services", "configmaps"]
    verbs: ["get", "list"]
    namespaces: ["*"]
---
apiVersion: v1
kind: RbacRole
metadata:
  name: deployer
spec:
  rules:
  - resources: ["deployments", "configmaps"]
    verbs: ["get", "list", "create", "update"]
    namespaces: ["default"]

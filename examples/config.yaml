# Cluster configuration — everything configurable, nothing hardcoded
apiVersion: royak/v1
kind: Config
metadata:
  name: cluster
spec:
  llm:
    provider: openai
    host: http://localhost:11433
    model: mlx-community--Llama-3.2-3B-Instruct-4bit
    temperature: 0.3
  alerts:
    webhook: /hooks/alert
    onAnomaly: true
    onRestart: true
    onRollout: false
  runtime: docker
  pause:
    enabled: true
    defaultIdleSeconds: 300
  api:
    port: 6443

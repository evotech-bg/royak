name: Royak CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}

      - name: Build
        run: cargo build --release

      - name: Pin signature-verified restic for this hosted test runner
        shell: bash
        run: |
          set -euo pipefail
          gpg --version >/dev/null
          TOOL_ROOT="tests/qualification/.runs/ci-restic-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-${RUNNER_OS}-${RUNNER_ARCH}"
          python3 -B tests/qualification/parallels/get_restic.py --host --root "$TOOL_ROOT" --github-env "$GITHUB_ENV"

      - name: Unit tests (cargo test; pinned restic required)
        run: cargo test --locked --bin royak

      - name: Check binary size (<10MB)
        run: |
          ls -lh target/release/royak
          SIZE=$(stat -f%z target/release/royak 2>/dev/null || stat -c%s target/release/royak)
          echo "Binary size: $SIZE bytes"
          if [ "$SIZE" -gt 10485760 ]; then
            echo "FAIL: Binary too large (>10MB)"
            exit 1
          fi

      - name: Check build has no errors
        run: cargo build --locked --release

      - name: "Smoke: brain + demo (no Docker required)"
        run: |
          target/release/royak brain 2>&1 | grep -q "OrinBrain"
          echo "Brain: OK"
          target/release/royak demo 2>&1 | grep -q "SCHEDULE\|Noop\|SCALE"
          echo "Demo: OK"

  docker-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ubuntu-cargo-docker-${{ hashFiles('**/Cargo.lock') }}

      - name: Build
        run: cargo build --release

      - name: Integration tests (test-demo.sh)
        run: bash test-demo.sh

      - name: StorageClass auto-provisioning
        run: |
          cat <<'YAML' | target/release/royak apply -
          ---
          kind: StorageClass
          metadata:
            name: ci-test
          spec:
            provisioner: royak/host-path
            hostPathPrefix: /tmp/ci-volumes
          ---
          kind: PersistentVolumeClaim
          metadata:
            name: test-pvc
          spec:
            storageClassName: ci-test
            resources:
              requests:
                storage: 1Gi
          YAML
          test -d /tmp/ci-volumes/default/test-pvc

      - name: Cleanup
        if: always()
        run: |
          docker rm -f $(docker ps -a --filter "name=rk-" -q) 2>/dev/null || true
          rm -f .royak-state.json .royak-state.json.nrns .royak-state.json.lock 2>/dev/null || true

  multinode:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ubuntu-cargo-multinode-${{ hashFiles('**/Cargo.lock') }}
      - name: Build
        run: cargo build --release
      - name: "Multi-node: signed census, remote workload contract, self-healing, node loss"
        run: bash test-multinode.sh

  ha-lease:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ubuntu-cargo-ha-${{ hashFiles('**/Cargo.lock') }}
      - name: Build
        run: cargo build --release
      - name: "Single writer: state owner lock + standby"
        run: bash test-ha-lease.sh

  raft-cluster:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ubuntu-cargo-raft-${{ hashFiles('**/Cargo.lock') }}
      - name: Build
        run: cargo build --release
      - name: "Raft: failover, catch-up, minority partition, delete propagation, snapshots"
        run: bash test-raft-cluster.sh

  servicelb-probes:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ubuntu-cargo-slb-${{ hashFiles('**/Cargo.lock') }}
      - name: Build
        run: cargo build --release
      - name: "ServiceLB readiness, live Service changes, tcpSocket/httpGet/exec probes"
        run: bash test-servicelb-probes.sh

  auth-http:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ubuntu-cargo-auth-${{ hashFiles('**/Cargo.lock') }}
      - name: Build
        run: cargo build --release
      - name: "Auth via the real API: malformed paths, trigger shadowing, exec RBAC, kubectl"
        run: bash test-auth-http.sh

  mesh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ubuntu-cargo-mesh-${{ hashFiles('**/Cargo.lock') }}
      - name: Build
        run: cargo build --release
      - name: Mesh proxy test
        run: bash test-mesh.sh
      - name: Cleanup
        if: always()
        run: docker rm -f $(docker ps -a --filter "name=rk-" -q) 2>/dev/null || true

  ingress:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ubuntu-cargo-ingress-${{ hashFiles('**/Cargo.lock') }}
      - name: Build
        run: cargo build --release
      - name: Ingress live proxy test
        run: bash test-ingress.sh
      - name: Cleanup
        if: always()
        run: docker rm -f $(docker ps -a --filter "name=rk-" -q) 2>/dev/null || true

  neuropod-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ubuntu-cargo-neuropod-${{ hashFiles('**/Cargo.lock') }}

      - name: Build the Linux/musl test binary
        run: python3 -B tests/qualification/run.py build --binary tests/qualification/.runs/linux-royak-neuropod-gc

      - name: Prepare isolated suite base images
        run: |
          docker pull alpine:3.22
          docker pull alpine:latest
          docker pull nginx:1.29-alpine

      - name: Real NeuroPod lifecycle and GC (zero skips)
        run: python3 -B tests/qualification/suites.py --binary tests/qualification/.runs/linux-royak-neuropod-gc --storage-driver overlay2 --suite test-neuropod.sh

      - name: Keep NeuroPod evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: neuropod-gc-evidence
          path: tests/qualification/.runs/rkq-suites-*/
          include-hidden-files: true

  build-pipeline:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ubuntu-cargo-buildpipe-${{ hashFiles('**/Cargo.lock') }}

      - name: Build
        run: cargo build --release

      - name: "PaaS build pipeline: git context → image → deploy → serve"
        run: bash test-build.sh

      - name: Cleanup
        if: always()
        run: docker rm -f $(docker ps -a --filter "name=rk-" -q) 2>/dev/null || true

  load-test:
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ubuntu-cargo-load-${{ hashFiles('**/Cargo.lock') }}

      - name: Build
        run: cargo build --release

      - name: Load + chaos test
        env:
          N_DEPLOYS: 10
          REPLICAS: 2
          TIMEOUT_SECS: 120
        run: bash test-load.sh

      - name: Cleanup
        if: always()
        run: docker rm -f $(docker ps -a --filter "name=rk-load-" -q) 2>/dev/null || true
